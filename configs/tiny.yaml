# BYTE v0.2.0 tiny experiment configuration.
# Run a synthetic pipeline check with:
# python -m byte.train --config configs/tiny.yaml --smoke-test
project:
  name: BYTE
  version: 0.2.0
  seed: 42

model:
  vocab_size: 256
  d_model: 128
  block_size: 16
  local_layers: 2
  global_layers: 2
  nhead: 4
  num_slots: 4
  target_active_slots: 2.0
  gate_threshold: 0.5
  budget_weight: 0.01
  dropout: 0.1

training:
  steps: 2
  batch_size: 2
  sequence_length: 128
  learning_rate: 0.0003
  validation_steps: 2
  test_steps: 2
  output_dir: runs/tiny

data:
  # Supply a UTF-8 text file and its provenance before real training.
  path: null
  source: null
  license: null
  train_fraction: 0.90
  validation_fraction: 0.05
